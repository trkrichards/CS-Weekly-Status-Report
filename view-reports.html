<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Readiness Weekly Status Report — View Reports</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    padding: 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header h1 { font-size: 22px; margin: 0 0 4px 0; }
  header .sub { color: #666; font-size: 13px; margin-bottom: 18px; }
  header .sub a { color: #b5482a; text-decoration: none; }
  header .sub a:hover { text-decoration: underline; }

  .empty, .error {
    background: #fff; border: 1px solid #e3e2de; border-radius: 10px;
    padding: 16px 18px; font-size: 13.5px; line-height: 1.6; color: #555;
  }
  .error { border-color: #f0c9c0; background: #fff8f6; color: #a3341c; }
  .error a, .empty a { color: #b5482a; }

  .report-card {
    background: #fff; border: 1px solid #e3e2de; border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
  }
  .report-card-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 18px; cursor: pointer;
  }
  .report-card-head:hover { background: #fafaf9; }
  .report-title { font-weight: 600; font-size: 14.5px; flex: 1 1 auto; }
  .report-filename { color: #888; font-size: 12px; }
  .report-card-links { display: flex; gap: 8px; font-size: 12.5px; }
  .report-card-links a {
    color: #1a1a1a; text-decoration: none; border: 1px solid #ddd; border-radius: 6px;
    padding: 4px 9px; background: #fafafa;
  }
  .report-card-links a:hover { background: #f0f0ee; }
  .report-card-body { display: none; padding: 4px 20px 18px 20px; border-top: 1px solid #f0efec; }
  .report-card.open .report-card-body { display: block; }
  .report-card.open .chevron { transform: rotate(90deg); }
  .chevron { color: #b5482a; transition: transform 0.15s; }

  .report-card-body h1 { font-size: 18px; margin: 14px 0 10px 0; }
  .report-card-body h2 { font-size: 13.5px; color: #b5482a; text-transform: uppercase; letter-spacing: 0.03em; margin: 16px 0 6px 0; }
  .report-card-body h3 { font-size: 12.5px; margin: 10px 0 4px 0; }
  .report-card-body p, .report-card-body li { font-size: 13px; line-height: 1.55; }
  .report-card-body ul { margin: 4px 0 8px 0; padding-left: 18px; }
  .report-card-body .signed { color: #206b3e; }
  .report-card-body .unsigned { color: #a3341c; }
  .loading { color: #888; font-size: 12.5px; font-style: italic; padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>View Reports</h1>
    <div class="sub"><a href="index.html">← Fill out this week's report</a> &nbsp;|&nbsp; <a href="report.html">View current draft</a></div>
  </header>

  <div id="listWrap"><p class="loading">Loading reports…</p></div>
</div>

<script>
// Set these to your repo so this page can list what's in reports/.
const GITHUB_OWNER = "OWNER";
const GITHUB_REPO = "REPO";
const GITHUB_BRANCH = "main";
const REPORTS_PATH = "reports";

function esc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Same simple markdown → HTML conversion used by report.html, since every
// file in reports/ is generated by this repo's own "Download Markdown" button.
function buildHtmlFromMarkdown(md) {
  const lines = md.split("\n");
  let html = "";
  let inList = false;
  function closeList() { if (inList) { html += "</ul>"; inList = false; } }

  lines.forEach(line => {
    if (line.startsWith("# ")) { closeList(); html += `<h1>${esc(line.slice(2))}</h1>`; }
    else if (line.startsWith("## ")) { closeList(); html += `<h2>${esc(line.slice(3))}</h2>`; }
    else if (line.startsWith("### ")) { closeList(); html += `<h3>${esc(line.slice(4))}</h3>`; }
    else if (line.startsWith("- [x]")) { closeList(); html += `<p class="signed">✅ ${esc(line.slice(5))}</p>`; }
    else if (line.startsWith("- [ ]")) { closeList(); html += `<p class="unsigned">⬜ ${esc(line.slice(5))}</p>`; }
    else if (line.startsWith("- ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${esc(line.slice(2))}</li>`;
    }
    else if (line.startsWith("**")) { closeList(); html += `<p><b>${esc(line.replace(/\*\*/g,""))}</b></p>`; }
    else if (line.trim() === "") { /* skip */ }
    else { closeList(); html += `<p>${esc(line)}</p>`; }
  });
  closeList();
  return html;
}

function titleFromFilename(name) {
  const m = name.match(/^(\d{4}-\d{2}-\d{2})_to_(\d{4}-\d{2}-\d{2})\.md$/i);
  if (m) return `Week of ${m[1]} – ${m[2]}`;
  return name.replace(/\.md$/i, "");
}

function renderError(message) {
  document.getElementById("listWrap").innerHTML = `
    <div class="error">
      <p>${message}</p>
      <p>You can also browse the folder directly on GitHub:
        <a href="https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/tree/${GITHUB_BRANCH}/${REPORTS_PATH}" target="_blank" rel="noopener">
          github.com/${GITHUB_OWNER}/${GITHUB_REPO}/tree/${GITHUB_BRANCH}/${REPORTS_PATH}
        </a>
      </p>
    </div>`;
}

function renderEmpty() {
  document.getElementById("listWrap").innerHTML = `
    <div class="empty">
      No reports have been published to <code>${REPORTS_PATH}/</code> yet.
      Fill out <a href="index.html">this week's report</a>, get it signed off, download the Markdown,
      and commit it there — see <code>reports/README.md</code> for the steps.
    </div>`;
}

async function loadReports() {
  const wrap = document.getElementById("listWrap");

  if (GITHUB_OWNER === "OWNER" || GITHUB_REPO === "REPO") {
    renderError(`Set <code>GITHUB_OWNER</code> and <code>GITHUB_REPO</code> at the top of <code>view-reports.html</code> before this page can list anything.`);
    return;
  }

  let files;
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${REPORTS_PATH}?ref=${GITHUB_BRANCH}`);
    if (!res.ok) {
      if (res.status === 404) { renderEmpty(); return; }
      throw new Error(`GitHub API returned ${res.status}`);
    }
    files = await res.json();
  } catch (err) {
    renderError(`Couldn't load the reports list (${esc(err.message)}). This can happen if the repo is private, the GitHub API rate limit was hit, or there's no network access.`);
    return;
  }

  files = (files || [])
    .filter(f => f.type === "file" && /\.md$/i.test(f.name) && f.name.toLowerCase() !== "readme.md")
    .sort((a, b) => b.name.localeCompare(a.name)); // newest first (filenames sort chronologically)

  if (files.length === 0) { renderEmpty(); return; }

  wrap.innerHTML = files.map((f, i) => `
    <div class="report-card" id="card-${i}">
      <div class="report-card-head" onclick="toggleCard(${i}, '${f.download_url}')">
        <span class="chevron">▸</span>
        <span class="report-title">${esc(titleFromFilename(f.name))}</span>
        <span class="report-filename">${esc(f.name)}</span>
        <span class="report-card-links" onclick="event.stopPropagation()">
          <a href="${f.html_url}" target="_blank" rel="noopener">Open on GitHub</a>
          <a href="${f.download_url}" target="_blank" rel="noopener">Raw</a>
        </span>
      </div>
      <div class="report-card-body" id="body-${i}"><p class="loading">Loading…</p></div>
    </div>
  `).join("");
}

const loadedCards = {};
async function toggleCard(i, downloadUrl) {
  const card = document.getElementById(`card-${i}`);
  card.classList.toggle("open");
  if (!card.classList.contains("open") || loadedCards[i]) return;

  const body = document.getElementById(`body-${i}`);
  try {
    const res = await fetch(downloadUrl);
    const md = await res.text();
    body.innerHTML = buildHtmlFromMarkdown(md);
    loadedCards[i] = true;
  } catch (err) {
    body.innerHTML = `<p class="loading">Couldn't load this report's contents. Try "Open on GitHub" or "Raw" instead.</p>`;
  }
}

document.addEventListener("DOMContentLoaded", loadReports);
</script>
</body>
</html>
