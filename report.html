<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Readiness Weekly Status Report — Report View</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
  }
  .report-bar {
    display: flex; gap: 10px; flex-wrap: wrap; position: sticky; top: 0;
    background: #f7f7f5; padding: 16px 24px; border-bottom: 1px solid #e3e2de; z-index: 10;
  }
  button, a.button {
    font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px;
    border: 1px solid #ddd; cursor: pointer; background: #fff; color: #1a1a1a;
    text-decoration: none; display: inline-block;
  }
  button:hover, a.button:hover { background: #f0f0ee; }
  .inner { max-width: 880px; margin: 0 auto; padding: 24px; }
  #report {
    background: #fff; border: 1px solid #e3e2de; border-radius: 10px;
    padding: 24px 28px; margin: 20px 0 60px 0;
  }
  #report h1 { font-size: 21px; margin: 0 0 14px 0; }
  #report h2 { font-size: 15px; color: #b5482a; text-transform: uppercase; letter-spacing: 0.03em; margin: 22px 0 8px 0; }
  #report h2:first-of-type { margin-top: 0; }
  #report h3 { font-size: 13.5px; margin: 14px 0 6px 0; }
  #report p, #report li { font-size: 13.5px; line-height: 1.6; }
  #report ul { margin: 4px 0 10px 0; padding-left: 20px; }
  #report .signed { color: #206b3e; }
  #report .unsigned { color: #a3341c; }
  #report .empty { color: #888; font-style: italic; }

  @media print {
    .report-bar { display: none !important; }
    .inner { padding: 0; }
    #report { border: none; padding: 0; margin: 0; }
  }
</style>
</head>
<body>
  <div class="report-bar">
    <a class="button" href="index.html">← Back to Edit</a>
    <a class="button" href="view-reports.html">View Reports</a>
    <button id="mdBtn">Download Markdown</button>
    <button id="printBtn">Print / Export PDF</button>
  </div>
  <div class="inner">
    <div id="report">
      <p class="empty">Loading…</p>
    </div>
  </div>

<script>
const SIGNERS = ["Kelly", "Barry", "Tessa", "Laura", "Andrew", "Jan"];

// Must match ACTIVE_PROJECTS in index.html — kept in sync manually.
const ACTIVE_PROJECTS = [
  { category: "Physician and Pharmacist Initiatives", items: [
    "ClinicalKey Unified Vision (CK+?)",
    "ClinicalKey for Nursing Unified Vision (CKN+?)",
    "ClinicalKey (CK) Physician BAU",
    "CK AI BAU",
    "CPCK BAU",
    "CK for Medical Schools BAU",
    "CK Test Prep BAU",
    "NEOID LMS Access CK Student",
  ]},
  { category: "Nursing and Patient Education Initiatives", items: [
    "Clinical Learning Hub",
    "CK Student NOAM/Clinical Cases BAU",
    "CK Nursing BAU",
    "Patient Pass/PE Products BAU",
    "Clinical eLearning BAU",
  ]},
  { category: "Specialist Solution Initiatives", items: [
    "ClinicalPath BAU",
    "ClinicalPath Provider Reports",
    "PSS BAU",
  ]},
  { category: "Strategic/Corporate Initiatives", items: [
    "eLearning Localization",
  ]},
  { category: "Miscellaneous", items: [
    "Project Phoenix Admin Console",
  ]},
];

function esc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildMarkdownFromData(data) {
  const ws = data.weekStart || "?", we = data.weekEnd || "?";
  let md = `# Commercial Readiness Weekly Status Report\n\n## Week of ${ws} – ${we}\n\n`;
  md += `## Summary\n${data.summary || "_(none entered)_"}\n\n`;

  md += `## Active Projects\n`;
  ACTIVE_PROJECTS.forEach((group, gi) => {
    md += `\n**${group.category}**\n`;
    group.items.forEach((name, ii) => {
      const id = `proj-${gi}-${ii}`;
      const f = (data.projects && data.projects[id]) || { status: "no", text: "" };
      const text = (f.text || "").trim();
      md += f.status === "yes" && text
        ? `- **${name}**: ${text}\n`
        : `- **${name}**: No updates\n`;
    });
  });
  md += `\n**Other / Miscellaneous**\n${(data.misc || "").trim() || "No updates"}\n`;

  md += `\n## Out of Office\n`;
  SIGNERS.forEach(name => {
    const val = ((data.ooo && data.ooo[name]) || "").trim();
    md += `- ${name}: ${val || "None"}\n`;
  });

  md += `\n## Recognition\n${(data.recognition || "").trim() || "_(none entered)_"}\n`;

  md += `\n## Sign Off\n`;
  SIGNERS.forEach(name => {
    const s = (data.signoff && data.signoff[name]) || { checked: false };
    md += s.checked
      ? `- [x] ${name} — signed ${s.iso ? new Date(s.iso).toLocaleString() : ""}\n`
      : `- [ ] ${name} — not yet signed\n`;
  });
  return md;
}

function buildHtmlFromMarkdown(md) {
  const lines = md.split("\n");
  let html = "";
  let inList = false;
  function closeList() { if (inList) { html += "</ul>"; inList = false; } }

  lines.forEach(line => {
    if (line.startsWith("# ")) { closeList(); html += `<h1>${esc(line.slice(2))}</h1>`; }
    else if (line.startsWith("## ")) { closeList(); html += `<h2>${esc(line.slice(3))}</h2>`; }
    else if (line.startsWith("### ")) { closeList(); html += `<h3>${esc(line.slice(4))}</h3>`; }
    else if (line.startsWith("- [x]")) { closeList(); html += `<p class="signed">✅ ${esc(line.slice(5))}</p>`; }
    else if (line.startsWith("- [ ]")) { closeList(); html += `<p class="unsigned">⬜ ${esc(line.slice(5))}</p>`; }
    else if (line.startsWith("- ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${esc(line.slice(2))}</li>`;
    }
    else if (line.startsWith("**")) { closeList(); html += `<p><b>${esc(line.replace(/\*\*/g,""))}</b></p>`; }
    else if (line.trim() === "") { /* skip */ }
    else { closeList(); html += `<p>${esc(line)}</p>`; }
  });
  closeList();
  return html;
}

function downloadMarkdown(md, data) {
  const blob = new Blob([md], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Commercial-Readiness-Weekly-Status-${data.weekStart || "draft"}_to_${data.weekEnd || "draft"}.md`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.addEventListener("DOMContentLoaded", () => {
  const container = document.getElementById("report");
  const params = new URLSearchParams(location.search);
  const week = params.get("week");

  if (!week) {
    container.innerHTML = `<p class="empty">No week specified. Open <a href="index.html">index.html</a>, fill in the form, and click "Save &amp; View Report" to get here.</p>`;
    document.getElementById("mdBtn").disabled = true;
    document.getElementById("printBtn").disabled = true;
    return;
  }

  const raw = localStorage.getItem("crw-draft-" + week);
  if (!raw) {
    container.innerHTML = `<p class="empty">No saved draft found for the week of ${esc(week)} in this browser. Open <a href="index.html">index.html</a>, enter that week, and click "Save &amp; View Report".</p>`;
    document.getElementById("mdBtn").disabled = true;
    document.getElementById("printBtn").disabled = true;
    return;
  }

  let data;
  try { data = JSON.parse(raw); }
  catch (e) {
    container.innerHTML = `<p class="empty">The saved draft for the week of ${esc(week)} couldn't be read.</p>`;
    return;
  }

  const md = buildMarkdownFromData(data);
  container.innerHTML = buildHtmlFromMarkdown(md);

  document.getElementById("mdBtn").addEventListener("click", () => downloadMarkdown(md, data));
  document.getElementById("printBtn").addEventListener("click", () => window.print());

  if (params.get("print") === "1") {
    setTimeout(() => window.print(), 300);
  }
});
</script>
</body>
</html>
